<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fakhriy — Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: #0b0b0b;
      color: #f5f5f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
    }

    .hero {
      margin-bottom: 32px;
    }

    .hero h1 {
      font-size: 52px;
      font-weight: 600;
      letter-spacing: -2px;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 18px;
      color: #9a9a9f;
      max-width: 600px;
      line-height: 1.7;
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      overflow: hidden;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    .pdf-viewer {
      width: 100%;
      height: 78vh;
      background: #111;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .actions {
      padding: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .meta {
      color: #8e8e93;
      font-size: 14px;
    }

    .btn {
      text-decoration: none;
      background: #f5f5f7;
      color: #111;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      transition: 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    footer {
      margin-top: 26px;
      text-align: center;
      color: #666;
      font-size: 13px;
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 38px;
      }

      .hero p {
        font-size: 16px;
      }

      .pdf-viewer {
        height: 70vh;
      }

      .actions {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <h1>Welcome to my Portfolio!</h1>
      <p>
      A simple collection of my work and experience.
      </p>
    </section>

    <section class="card">
      <div class="pdf-viewer">
        <!-- Ganti portfolio.pdf dengan nama file PDF kamu -->
        <iframe src="Unitled design (1).pdf"></iframe>
      </div>

      <div class="actions">
        <div class="meta">
          Portfolio PDF • Updated 2026
        </div>

        <a href="portfolio.pdf" download class="btn">
          Download PDF
        </a>
      </div>
    </section>

    <footer>
      © 2026 Fakhriy
    </footer>
  </div>
</body>
</html>
